# Seismic Phase Picker Configuration

data:
  raw_path: "data/raw/"
  labels_path: "data/labels/"
  processed_path: "data/processed/"
  format: "auto"          # auto / mseed / hdf5

preprocessing:
  demean: true
  detrend: true
  taper: true
  taper_alpha: 0.05
  bandpass: null          # [1, 20] for OBS data
  normalize: true         # Z-score per-channel
  sampling_rate: 100      # Hz

model:
  type: "phasenet"        # phasenet / eqtransformer
  jit_path: "models/phasenet.jit"
  info_path: "models/model_info.json"
  device: "cpu"           # cpu / cuda / mps

inference:
  window_length: 30.0     # seconds
  step_size: 15.0         # seconds (50% overlap)
  batch_size: 32
  threshold: 0.5

event_detection:
  sta: 1.0                # short-term window (seconds)
  lta: 30.0               # long-term window (seconds)
  threshold: 3.0          # STA/LTA trigger threshold
  pre_window: 5.0         # padding before trigger (seconds)
  post_window: 30.0       # padding after trigger (seconds)

postprocess:
  method: "peak_detection"
  min_distance: 50        # samples
  prominence: 0.3

evaluation:
  tolerance: 0.5          # seconds
  phases: ["P", "S"]

logging:
  level: "INFO"
  output_dir: "outputs/logs/"
